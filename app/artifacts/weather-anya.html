<div id="root" style="font-family: 'IBM Plex Mono', 'Space Grotesk', monospace; max-width: 420px; margin: 0 auto; padding: 24px; background: #14161a; color: #e8e6e1; border-radius: 12px;">
  <h2 style="margin: 0 0 4px 0; font-size: 18px; font-weight: 600; letter-spacing: 0.02em;">Weather at Anya's</h2>
  <p style="margin: 0 0 20px 0; font-size: 12px; color: #8a8f98;">via MCP connector</p>
  <div id="status" style="font-size: 14px; color: #8a8f98;">Loading…</div>
  <div id="result" style="margin-top: 12px; font-size: 15px; line-height: 1.6; white-space: pre-wrap;"></div>
</div>

<script>
async function fetchWeather() {
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');
  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [
          { role: "user", content: "Get the weather forecast for latitude 44.61, longitude -67.51 (Maine, USA) using the get-forecast tool. Give me a concise, clear answer with temperature and conditions." }
        ],
        mcp_servers: [
          {
            type: "url",
            url: "https://weather-five-eosin-13.vercel.app/mcp",
            name: "weather-at-anyas"
          }
        ]
      })
    });

    if (!response.ok) {
      throw new Error("Request failed: " + response.status);
    }

    const data = await response.json();

    const textBlocks = (data.content || [])
      .filter(item => item.type === "text")
      .map(item => item.text)
      .join("\n\n");

    const toolCalls = (data.content || []).filter(item => item.type === "mcp_tool_use");
    const toolResults = (data.content || []).filter(item => item.type === "mcp_tool_result");

    statusEl.textContent = toolCalls.length
      ? "Fetched via " + (toolCalls[0].name || "connector")
      : "Response received";

    resultEl.textContent = textBlocks || (toolResults[0]?.content?.[0]?.text) || "No response text returned.";
  } catch (err) {
    statusEl.textContent = "Error";
    resultEl.textContent = String(err.message || err);
  }
}

fetchWeather();
</script>
